<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>
      Page not found · Page introuvable — ck-you3
    </title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/ck-you3/assets/favicon-32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/ck-you3/assets/apple-touch-icon.png"
    />
    <link rel="stylesheet" href="/ck-you3/styles.css" />
  </head>
  <body>
    <main class="section">
      <div class="container container--narrow">
        <div class="download">
          <img
            class="download__icon"
            src="/ck-you3/assets/icon.png"
            alt="ck-you3 app icon"
            width="88"
            height="88"
          />
          <h1>Page not found</h1>
          <p class="download__lead">This page does not exist, or it has moved.</p>
          <p class="download__lead" lang="fr">
            Page introuvable — Cette page n’existe pas ou a été déplacée.
          </p>
          <div class="buttons buttons--center">
            <a class="button button--light" href="/ck-you3/" hreflang="en">
              <span class="button__text">
                <span class="button__label">Go to the ck-you3 home page</span>
              </span>
            </a>
            <a
              class="button button--ghost"
              href="/ck-you3/fr/"
              hreflang="fr"
              lang="fr"
            >
              <span class="button__text">
                <span class="button__label">Aller à l’accueil de ck-you3</span>
              </span>
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
